# The iOS app's Xcode project: `xcodegen` makes Mail.xcodeproj from this file.
name: Mail
options:
  bundleIdPrefix: com.yekta.mail
  deploymentTarget:
    iOS: "18.0"
packages:
  MailUI:
    path: ../../packages/apple
settings:
  base:
    # The app's bundle id. The extension's and the app group's follow it; testflight.sh sets it.
    APP_BUNDLE_ID: com.yekta.mail.ios
    APP_GROUP: group.$(APP_BUNDLE_ID)
    # Which APNs the device's token is for: `production` in builds for TestFlight.
    APS_ENVIRONMENT: development
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
targets:
  Mail:
    type: application
    platform: iOS
    sources:
      - Mail
      - path: ../macos/Resources/AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: MailUI
      - target: NotificationService
    preBuildScripts:
      - name: Build the core
        script: '"$SRCROOT/scripts/build-core.sh"'
        basedOnDependencyAnalysis: false
    info:
      path: Mail/Info.plist
      properties:
        CFBundleDisplayName: Wonnet
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: com.yekta.mail.auth
            CFBundleURLSchemes: [mailapp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        MailServerURL: $(MAIL_SERVER_URL)
        NSContactsUsageDescription: Wonnet shows the names and photos you gave people in your contacts, and suggests them when you write.
        UIBackgroundModes: [remote-notification]
        AppGroup: $(APP_GROUP)
        PushEnvironment: $(APS_ENVIRONMENT)
        # New mail shows as a message from its sender, with their avatar.
        NSUserActivityTypes: [INSendMessageIntent]
    entitlements:
      path: Mail/Mail.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.security.application-groups: [$(APP_GROUP)]
        com.apple.developer.usernotifications.communication: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: Wonnet
        MAIL_SERVER_URL: https://api.wonnet.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Set by scripts/testflight.sh, which signs with the App Store profile it is given.
        PROVISIONING_PROFILE_SPECIFIER: $(IOS_PROFILE_NAME)
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(SRCROOT)/../../target/aarch64-apple-ios/release
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(SRCROOT)/../../target/aarch64-apple-ios-sim/release
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        OTHER_LDFLAGS: [-lmail_core, -framework, Security, -framework, SystemConfiguration, -framework, CoreFoundation, -liconv]
  # Opens the sealed pushes of new mail with the key the app keeps in their app group's keychain.
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - NotificationService
    dependencies:
      - package: MailUI
        product: MailPush
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Wonnet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroup: $(APP_GROUP)
        NSUserActivityTypes: [INSendMessageIntent]
        NSContactsUsageDescription: Wonnet shows the photos you gave people in your contacts on their mail's notifications.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: NotificationService/NotificationService.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
        com.apple.developer.usernotifications.communication: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).notifications
        PRODUCT_NAME: NotificationService
        PROVISIONING_PROFILE_SPECIFIER: $(IOS_EXTENSION_PROFILE_NAME)
