[package]
name = "mail-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mail-protocol = { workspace = true, features = ["tls"] }
aes-gcm = "0.11"
anyhow.workspace = true
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
axum = { version = "0.8", features = ["macros", "ws"] }
base64.workspace = true
chrono.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
hickory-resolver = "0.26"
html5ever = "0.40"
image = { version = "0.25", default-features = false, features = ["gif", "ico", "jpeg", "png", "webp"] }
lol_html = "3"
maud = "0.27"
mail-builder.workspace = true
mail-parser.workspace = true
percent-encoding = "2"
psl = "2"
resvg = { version = "0.48", default-features = false }
reqwest = { workspace = true, features = ["http2"] }
ring = "0.17"
rmcp = { version = "3.8", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "migrate", "chrono", "uuid", "json"] }
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower-http = { version = "0.7", features = ["cors", "trace", "set-header"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"
uuid.workspace = true
webpki-roots = "1"

[dev-dependencies]
mail-core.workspace = true
tempfile.workspace = true
