name: Release

# On every push to main that touches the apps: builds the Mac app (signed and notarized), the
# Android app and the Windows and Linux app, publishes them together as a GitHub release, and
# uploads the iOS app to TestFlight. The version is the one scripts/release-version.sh gives the
# commit. The installed apps update themselves from the release's files, so their names stay.
on:
  push:
    branches: [main]
    paths:
      - apps/macos/**
      - apps/ios/**
      - apps/android/**
      - apps/gpui/**
      - packages/apple/**
      - packages/theme/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - scripts/release-version.sh
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        run: echo "VERSION=$(scripts/release-version.sh)" >> "$GITHUB_ENV"

      - name: Toolchain
        run: |
          xcodebuild -version
          rustup update stable --no-self-update
          rustup default stable

      # Shared with the macOS workflow's pull requests.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos

      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Build and sign the app
        env:
          MAIL_SIGN_IDENTITY: Developer ID Application
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          export MAIL_PROVISIONING_PROFILE="$RUNNER_TEMP/Wonnet.provisionprofile"
          echo "$MACOS_PROVISIONING_PROFILE" | base64 --decode > "$MAIL_PROVISIONING_PROFILE"
          apps/macos/scripts/build-app.sh

      - name: Notarize the app
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          echo "$APPLE_API_KEY" > "$RUNNER_TEMP/api-key.p8"
          CREDENTIALS=(--key "$RUNNER_TEMP/api-key.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          ditto -c -k --keepParent apps/macos/build/Wonnet.app "$RUNNER_TEMP/notarize.zip"
          SUBMISSION="$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${CREDENTIALS[@]}" --output-format json | jq -r .id)"
          STATUS=0
          xcrun notarytool wait "$SUBMISSION" "${CREDENTIALS[@]}" --timeout 30m || STATUS=$?
          xcrun notarytool log "$SUBMISSION" "${CREDENTIALS[@]}" || true
          [ "$STATUS" -eq 0 ] || exit "$STATUS"
          xcrun stapler staple apps/macos/build/Wonnet.app
          spctl --assess --type execute --verbose apps/macos/build/Wonnet.app

      - name: Zip the app
        run: ditto -c -k --keepParent apps/macos/build/Wonnet.app Wonnet.zip

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: Wonnet.zip
          retention-days: 1

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        run: scripts/release-version.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      # Shared with the Android workflow's pull requests.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android

      - name: Build and sign the app
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # An APK signed with any other key can't update the copies already installed.
          [ -n "$ANDROID_KEYSTORE" ] || { echo "ANDROID_KEYSTORE is missing"; exit 1; }
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEYSTORE" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > apps/android/app/google-services.json
          fi
          apps/android/scripts/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: apps/android/build/Wonnet.apk
          retention-days: 1

  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        run: scripts/release-version.sh

      - name: Toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable

      # Shared with the Desktop workflow's pull requests.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/gpui
          shared-key: desktop-windows

      - name: Build the app
        run: apps/gpui/scripts/build-windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: apps/gpui/build/Wonnet-windows-x86_64.zip
          retention-days: 1

  linux:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        run: scripts/release-version.sh

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat apps/gpui/scripts/linux-packages.txt)
          rustup update stable --no-self-update
          rustup default stable

      # Shared with the Desktop workflow's pull requests.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/gpui
          shared-key: desktop-linux-${{ matrix.arch }}

      - name: Build the app
        run: apps/gpui/scripts/build-linux.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: apps/gpui/build/Wonnet-linux-${{ matrix.arch }}.AppImage
          retention-days: 1

  # One release with every app that built. Without the Mac app there is none, as before.
  publish:
    needs: [macos, android, windows, linux]
    if: ${{ !cancelled() && needs.macos.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        run: echo "VERSION=$(scripts/release-version.sh)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      # The Windows and Linux app installs only what this key signed. Its public half is in
      # apps/gpui/src/updater.rs.
      - name: Sign the desktop app
        env:
          DESKTOP_UPDATE_KEY: ${{ secrets.DESKTOP_UPDATE_KEY }}
        run: |
          [ -n "$DESKTOP_UPDATE_KEY" ] || { echo "DESKTOP_UPDATE_KEY is missing"; exit 1; }
          echo "$DESKTOP_UPDATE_KEY" > "$RUNNER_TEMP/update-key.pem"
          for file in release/Wonnet-windows-* release/Wonnet-linux-*; do
            [ -f "$file" ] || continue
            openssl pkeyutl -sign -inkey "$RUNNER_TEMP/update-key.pem" -rawin -in "$file" -out "$file.sig"
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" \
            --generate-notes release/*

  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        run: scripts/release-version.sh

      - name: Toolchain
        run: |
          xcodebuild -version
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-apple-ios
          brew install xcodegen

      # Shared with the iOS workflow's pull requests.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ios

      - name: Import the signing certificate
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$IOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          IOS_EXTENSION_PROVISIONING_PROFILE: ${{ secrets.IOS_EXTENSION_PROVISIONING_PROFILE }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: apps/ios/scripts/testflight.sh
