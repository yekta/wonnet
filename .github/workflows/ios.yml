name: iOS

# Builds the iOS app for devices, unsigned, on pull requests that change what the app is made of.
# Main is built and sent to TestFlight by release.yml.
on:
  pull_request:
    paths:
      - apps/ios/**
      - apps/macos/Resources/**
      - packages/apple/**
      - packages/theme/**
      - crates/**
      - Cargo.lock
      - .github/workflows/ios.yml
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-apple-ios
          brew install xcodegen

      # The release's cache: the core is built for devices there too, and only main saves caches.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ios
          save-if: false

      - name: Generate the project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Build for devices
        working-directory: apps/ios
        run: |
          xcodebuild -project Mail.xcodeproj -scheme Mail \
            -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test "${PIPESTATUS[0]}" -eq 0
